[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.36"
optimizer = true
optimizer_runs = 150
remappings = [
    "solady/=lib/solady/src/",
    "pendle-sy/=lib/pendle-sy-public/contracts/",
    "pendle-core/=lib/pendle-core-v2-public/contracts/",
    "pendle-oz/=lib/pendle-openzeppelin-contracts/contracts/",
    "lib/pendle-sy-public/:@openzeppelin/contracts/=lib/pendle-openzeppelin-contracts/contracts/",
    "lib/pendle-core-v2-public/:@openzeppelin/contracts/=lib/pendle-openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/"
]

[lint]
# whileUnpaused must retain pre-call state across the modified function to restore
# an existing pause; the linter's helper extraction is not behavior-preserving.
exclude_lints = ["unwrapped-modifier-logic"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
